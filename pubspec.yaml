name: hamro_pasal
description: "HamroByapar - Offline business management app for Nepal's SME market"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Navigation
  go_router: ^14.2.0

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.1
  # bluetooth_print: ^4.3.0  # Temporarily disabled - compatibility issue

  # Charts
  fl_chart: ^0.68.0

  # Barcode
  mobile_scanner: ^5.2.3

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Calendar & Date
  nepali_utils: ^3.0.5
  intl: any

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # File Management
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Cloud Backup
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1
  http: ^1.2.2

  # Material 3
  dynamic_color: ^1.7.0

  # Connectivity
  connectivity_plus: ^6.0.5

  # Immutable Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/

